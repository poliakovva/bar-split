<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>чек из бара — кто за что скинул</title>
<meta name="theme-color" content="#f6f4ef">
<style>
  :root{--bg:#f6f4ef;--fg:#1d1c1a;--mut:#8a867d;--line:#e3dfd5;--acc:#2f6f4e;--acc2:#e7f0ea;--sel:#1d1c1a;--warn:#b5651d}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--mut:#8d8a82;--line:#2a2927;--acc:#6fbf8f;--acc2:#1d2a22;--sel:#ecebe6;--warn:#e0a060}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
  h1{font-size:20px;margin:0 0 2px;font-weight:600}
  .mut{color:var(--mut)}
  .sm{font-size:13px}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 6px}
  .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font:inherit}
  input:focus{outline:none;border-color:var(--fg)}
  .name{margin:18px 0 6px}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:26px 0 6px}
  .item{padding:10px 0;border-bottom:1px solid var(--line)}
  .item .t{font-size:15px}
  .item .p{color:var(--mut);font-size:13px;white-space:nowrap}
  .units{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .u{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;min-width:44px;text-align:left;line-height:1.25;-webkit-tap-highlight-color:transparent}
  .u small{display:block;color:var(--mut);font-size:11px}
  .u.mine{background:var(--sel);color:var(--bg);border-color:var(--sel)}
  .u.mine small{color:var(--bg);opacity:.7}
  .u.done{background:var(--acc2);border-color:transparent;color:var(--acc);cursor:default}
  .u.done small{color:var(--acc)}
  .u.part{border-color:var(--acc)}
  .foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;background:var(--fg);color:var(--bg);cursor:pointer;white-space:nowrap}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
  .btn.ok{background:var(--acc);color:#fff}
  .btn:disabled{opacity:.35;cursor:default}
  .hint{font-size:13px;color:var(--mut);margin:6px 0 0}
  .people .row{padding:7px 0;border-bottom:1px solid var(--line)}
  .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;padding:0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
  .hidden{display:none!important}
  a{color:inherit}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <h1>чек из бара</h1>
  <div class="mut sm" id="sub">загружаю…</div>
  <div class="bar"><i id="prog"></i></div>
  <div class="row sm"><span id="paidTxt"></span><span class="mut" id="leftTxt"></span></div>

  <!-- admin: вход -->
  <div id="adminBox" class="card hidden"></div>

  <div class="name">
    <input type="text" id="name" placeholder="как тебя зовут?" autocomplete="given-name">
    <p class="hint">тапни то, что ты ел и пил. тапнешь ещё раз — доля станет ½, ⅓, ¼ (если делили на несколько человек). переведи и жми «я перевёл». зелёное — уже оплачено.</p>
  </div>

  <div id="list"></div>

  <h2>кто сколько скинул</h2>
  <div class="people" id="people"></div>
  <p class="sm mut" style="margin-top:28px"><a href="#admin" id="adminLink">я влад</a></p>
</main>

<div class="foot"><div class="in">
  <div><div id="mySum" style="font-weight:600">0 ₽</div><div class="sm mut" id="myNote">ничего не выбрано</div></div>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" id="clearBtn">сброс</button>
    <button class="btn" id="sendBtn" disabled>я перевёл</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ===== настройки =====
const REPO = 'poliakovva/bar-split';
const PAY = 'т-банк +7 993 927-01-29';   // реквизиты — показываются внизу
const TOTAL = 40084;

// [название, цена, кол-во, раздел] — ровно как в чеке (29 строк, сумма 40 084 ₽)
const ITEMS = [
  ['Clover Club',1089,5,'коктейли'],
  ['Aries',1089,1,'коктейли'],
  ['Smoky Pear lemonade',550,2,'лимонады'],
  ['Мезе',1518,1,'еда'],
  ['Жареный сулугуни с заатаром и соусом амба',748,4,'еда'],
  ['Грибной пирог с козьим сыром и сливочным соусом',946,1,'еда'],
  ['Пита с кебабом из говядины и израильским салатом',935,1,'еда'],
  ['Dry Daiquiri',1089,2,'коктейли'],
  ['Микс салатов с индейкой, кукурузой, хрустящими баклажанами, фундуком',858,1,'еда'],
  ['Paloma Lemonade',1089,3,'коктейли'],
  ['Шварма из индейки',902,3,'еда'],
  ['Bareket lemonade',550,2,'лимонады'],
  ['Сырный фалафель с амбой и тхиной',638,1,'еда'],
  ['Шницель из индейки с соусом песто и овощным салатом',1298,1,'еда'],
  ['Бурекасы с баклажаном',792,1,'еда'],
  ['Пита с куриным шницелем, коул-слоу, солёным огурцом и соусом айоли',858,2,'еда'],
  ['Маца',88,2,'хлеб'],
  ['Пита',55,2,'хлеб'],
  ['Хала',55,3,'хлеб'],
  ['Espresso Martini',1089,1,'коктейли'],
  ['Tommy D Sour',1089,3,'коктейли'],
  ['Raspberry jalapeno lemonade',550,1,'лимонады'],
  ['Jerusalem Elixir',1089,1,'коктейли'],
  ['Чипсы из батата с домашним айоли',528,1,'еда'],
  ['Тартар из говядины с кедровыми орехами',1012,1,'еда'],
  ['Запечённый шафрановый чизкейк с соусом амба',792,1,'еда'],
  ['Grapefruit lemonade',550,1,'лимонады'],
  ['New York Sour',1089,1,'коктейли'],
  ['Taurus',1089,1,'коктейли'],
];
const SECTIONS = ['коктейли','лимонады','еда','хлеб'];
const PRICE = {}; ITEMS.forEach((it,i)=>{for(let k=0;k<it[2];k++)PRICE[i+'-'+k]=it[1]});

// ===== состояние =====
// state.claims: { unitId: [{n: имя, d: делитель}] } — кто что оплатил; state.w — общий ключ записи
let state = {claims:{}}, sha = null;
let mine = load('mine', {});          // { unitId: делитель } — выбор на этом устройстве
const $ = id => document.getElementById(id);
function load(k,d){try{return JSON.parse(localStorage.getItem('bs_'+k))??d}catch{return d}}
function save(k,v){try{localStorage.setItem('bs_'+k,JSON.stringify(v))}catch{}}
const rub = x => Math.round(x).toLocaleString('ru-RU').replace(/,/g,' ')+' ₽';
const FR = {1:'',2:'½',3:'⅓',4:'¼'};
const token = () => load('token', '');                       // есть только у влада
const enc = t => btoa(t.split('').reverse().join(''));        // чтобы github не отозвал ключ
const dec = w => { try{ return atob(w).split('').reverse().join('') }catch{ return '' } };
const key = () => token() || dec(state.w||'');
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const covered = id => (state.claims[id]||[]).reduce((s,c)=>s+1/c.d,0);
const norm = s => s.trim().toLowerCase();
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function fetchState(){
  try{
    const k=key();
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/state.json?t=${Date.now()}`,
      {headers: k?{Authorization:'Bearer '+k}:{}, cache:'no-store'});
    if(!r.ok) throw 0;
    const j = await r.json(); sha = j.sha;
    state = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  }catch{
    try{ state = await (await fetch('state.json?t='+Date.now(),{cache:'no-store'})).json() }catch{}
  }
  state.claims ||= {};
}
async function pushState(msg){
  const body = {message:msg, content:btoa(unescape(encodeURIComponent(JSON.stringify(state,null,1)))), sha};
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/state.json`,
    {method:'PUT',headers:{Authorization:'Bearer '+key(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status);
  sha = (await r.json()).content.sha;
}
// изменить state и сохранить; если кто-то записал одновременно — перечитать и повторить
async function update(fn,msg){
  for(let i=0;i<4;i++){
    await fetchState(); fn();
    try{ await pushState(msg); return true }catch(e){ if(!['409','422'].includes(e.message)){ toast('не сохранилось: '+e.message); return false } }
    await new Promise(r=>setTimeout(r,400+Math.random()*600));
  }
  toast('не сохранилось, попробуй ещё раз'); return false;
}

// ===== отрисовка =====
function render(){
  let paid = 0; for(const id in PRICE) paid += PRICE[id]*Math.min(1,covered(id));
  $('sub').textContent = `${ITEMS.reduce((s,i)=>s+i[2],0)} позиций · всего ${rub(TOTAL)}`;
  $('prog').style.width = (paid/TOTAL*100)+'%';
  $('paidTxt').textContent = 'скинули '+rub(paid);
  $('leftTxt').textContent = 'осталось '+rub(TOTAL-paid);

  const L = $('list'); L.innerHTML='';
  for(const sec of SECTIONS){
    const h=document.createElement('h2'); h.textContent=sec; L.appendChild(h);
    ITEMS.forEach((it,i)=>{
      if(it[3]!==sec) return;
      const d=document.createElement('div'); d.className='item';
      d.innerHTML=`<div class="row"><span class="t">${it[0]}</span><span class="p">${it[2]>1?it[2]+' × ':''}${rub(it[1])}</span></div>`;
      const us=document.createElement('div'); us.className='units';
      for(let k=0;k<it[2];k++){
        const id=i+'-'+k, cov=covered(id), cl=state.claims[id]||[];
        if(mine[id] && 1/mine[id]>1-cov+1e-9){ delete mine[id]; save('mine',mine) }   // кто-то уже занял
        const b=document.createElement('button'); b.className='u';
        const who=cl.map(c=>esc(c.n)+(c.d>1?' '+FR[c.d]:'')).join(', ');
        if(mine[id]) b.classList.add('mine');
        else if(cov>=0.999) b.classList.add('done');
        else if(cov>0) b.classList.add('part');
        const label = it[2]>1 ? '#'+(k+1) : (cov>=0.999?'оплачено':'моё');
        b.innerHTML = (mine[id]? (FR[mine[id]]||'✓')+' ' : (cov>=0.999?'✓ ':'')) + label + (who?`<small>${who}</small>`:'');
        if(cov<0.999 || mine[id]) b.onclick=()=>toggle(id);
        us.appendChild(b);
      }
      d.appendChild(us); L.appendChild(d);
    });
  }

  const P={}; for(const id in state.claims) for(const c of state.claims[id]) P[c.n]=(P[c.n]||0)+PRICE[id]/c.d;
  const pp=$('people'); pp.innerHTML='';
  const names=Object.keys(P).sort((a,b)=>P[b]-P[a]);
  if(!names.length) pp.innerHTML='<div class="sm mut">пока никто</div>';
  for(const n of names){
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span>${esc(n)}</span><span>${rub(P[n])}${token()?` <button class="x" title="убрать">×</button>`:''}</span>`;
    const x=r.querySelector('.x'); if(x) x.onclick=()=>removePerson(n);
    pp.appendChild(r);
  }

  const ids=Object.keys(mine), s=ids.reduce((a,id)=>a+PRICE[id]/mine[id],0);
  $('mySum').textContent = rub(s);
  $('myNote').textContent = ids.length ? PAY : 'ничего не выбрано';
  $('sendBtn').disabled = !ids.length;
  $('clearBtn').classList.toggle('hidden', !ids.length);
  $('adminLink').classList.toggle('hidden', !!token());
}

function toggle(id){
  const left = 1-covered(id);
  const seq=[1,2,3,4].filter(d=>1/d<=left+1e-9);       // какие доли ещё влезают
  const cur=mine[id], i=cur?seq.indexOf(cur):-1;
  if(i+1<seq.length) mine[id]=seq[i+1]; else delete mine[id];
  save('mine',mine); render();
}
$('clearBtn').onclick=()=>{ mine={}; save('mine',mine); render() };
$('name').value=load('name',''); $('name').oninput=e=>save('name',e.target.value.trim());

// ===== «я перевёл» — сразу записываем =====
$('sendBtn').onclick=async()=>{
  const n=$('name').value.trim();
  if(!n){ $('name').focus(); toast('сначала имя'); return }
  if(!key()){ toast('влад ещё не открыл запись'); return }
  const u={...mine}, sum=Object.keys(u).reduce((a,id)=>a+PRICE[id]/u[id],0);
  $('sendBtn').disabled=true;
  const ok = await update(()=>{ for(const id in u){ const a=state.claims[id] ||= []; const c=a.find(x=>norm(x.n)===norm(n)); if(c) c.d=u[id]; else a.push({n,d:u[id]}) } },
    `${n}: +${Math.round(sum)} ₽`);
  if(ok){ mine={}; save('mine',mine); toast('записал, спасибо!') }
  render();
};

// ===== влад =====
function adminBox(){
  const box=$('adminBox');
  if(!location.hash.startsWith('#admin') || token()){ box.classList.add('hidden'); return }
  box.classList.remove('hidden');
  box.innerHTML=`<b>вход для влада</b><p class="hint">fine-grained github-токен только на репо ${REPO} с правом contents: read & write.</p>
    <input type="password" id="tok" placeholder="github_pat_…"><div style="margin-top:10px"><button class="btn" id="tokBtn">сохранить</button></div>`;
  $('tokBtn').onclick=async()=>{ save('token',$('tok').value.trim()); location.hash=''; await start() };
}
async function removePerson(n){
  if(!confirm(`убрать все отметки «${n}»?`)) return;
  await update(()=>{ for(const id in state.claims){ state.claims[id]=state.claims[id].filter(c=>c.n!==n); if(!state.claims[id].length) delete state.claims[id] } }, `убрал ${n}`);
  render();
}
async function start(){
  await fetchState(); adminBox(); render();
  // влад открыл сайт — делимся ключом записи с друзьями
  if(token() && state.w!==enc(token())){ if(await update(()=>{ state.w=enc(token()) },'открыл запись')) render() }
}

window.addEventListener('hashchange',()=>{adminBox();render()});
render(); start();
setInterval(async()=>{ if(document.visibilityState==='visible'){ await fetchState(); render() } }, 30000);
</script>
</body>
</html>
